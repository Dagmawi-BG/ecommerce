<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Checkout')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-4">Checkout</h1>

    <div class="row g-4">
        <div class="col-md-6">
            <h2 class="h5">Order summary</h2>
            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between"
                    th:each="line : ${cart.items}">
                    <span th:text="${line.name} + ' × ' + ${line.quantity}">Item</span>
                    <span th:text="'$' + ${line.lineTotal}">$0.00</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span>Subtotal</span>
                    <span th:text="'$' + ${cart.subtotal}">$0.00</span>
                </li>
                <li class="list-group-item d-flex justify-content-between text-success"
                    th:if="${cart.discount != null and cart.discount.signum() > 0}">
                    <span>Discount (<span th:text="${cart.couponCode}">CODE</span>)</span>
                    <span th:text="'-$' + ${cart.discount}">-$0.00</span>
                </li>
                <li class="list-group-item d-flex justify-content-between fw-bold">
                    <span>Total</span>
                    <span th:text="'$' + ${cart.total}">$0.00</span>
                </li>
            </ul>
        </div>

        <div class="col-md-6">
            <h2 class="h5">Shipping address</h2>
            <form th:action="@{/checkout}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="street">Street</label>
                    <input class="form-control" id="street" name="street" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="city">City</label>
                    <input class="form-control" id="city" name="city" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="zip">ZIP</label>
                    <input class="form-control" id="zip" name="zip" required>
                </div>
                <button type="submit" class="btn btn-success"
                        th:disabled="${#lists.isEmpty(cart.items)}">Place order</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
